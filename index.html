<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SUELTA - Refugio Emocional</title>
    <meta name="description" content="SUELTA: Refugio emocional digital. Cinco minutos para recuperar la calma, expresar lo que sientes y soltar tus cargas." />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#141210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUELTA" />

    <!-- Manifest & Favicon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts: EB Garamond (soulful editorial serif) + Plus Jakarta Sans (humanist geometric sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#141210] text-[#fcfbf9] selection:bg-[#ff7854]/30 selection:text-[#ff7854]">
    <!-- Background Relaxation Music (Strictly no autoplay, controlled by user) -->
    <audio id="musica" src="/relax.mp3" loop preload="auto"></audio>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado con éxito:', reg.scope))
            .catch(err => console.log('SW fallo al registrar:', err));
        });
      }
    </script>
  </body>
</html>
